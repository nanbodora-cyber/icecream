<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰淇淋叠叠乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%A8%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: light dark;
    --bg:#fbf8f5; --card:#ffffff; --ink:#3d2b31; --muted:#8c7077;
    --line:#eaddd8; --accent:#d9627f; --accent-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#211a1d; --card:#2b2226; --ink:#f6e9ec; --muted:#bd9ea6;
      --line:#44353b; --accent:#e8789a; --accent-ink:#2a1119;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    line-height:1.5;
  }
  main{max-width:440px; margin:0 auto; padding:16px 14px 30px;}
  h1{font-size:21px; margin:4px 0 2px; font-weight:700;}
  .sub{margin:0 0 12px; font-size:14px; color:var(--muted);}
  .stage-wrap{position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line);}
  #stage svg{display:block; width:100%; height:auto;}
  #hint{position:absolute; left:0; right:0; top:42%; text-align:center; font-size:15px; color:#a98d92; pointer-events:none;}
  #count{margin:10px 0 8px; font-size:14px; color:var(--muted); text-align:center; min-height:22px;}
  #grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  button{font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; cursor:pointer; touch-action:manipulation;}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  button:active{transform:scale(.97);}
  .flavor{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 6px; font-size:12px;}
  .row{display:flex; gap:8px; margin-top:10px;}
  .row button{flex:1; height:44px; font-size:14px;}
  .primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  #result{margin-top:14px; padding:16px 14px; text-align:center; border:1px solid var(--line); border-radius:16px; background:var(--card);}
  #rname{margin:0 0 6px; font-size:22px; font-weight:700;}
  #rbless{margin:0; font-size:15px; color:var(--muted);}
  #msg{margin:8px 0 0; font-size:13px; color:var(--muted); text-align:center; min-height:20px;}
  @media (prefers-reduced-motion: reduce){button:active{transform:none;}}
</style>
</head>
<body>
<main>
  <h1>冰淇淋叠叠乐</h1>
  <p class="sub">点口味，最多叠四球，做好后会得到名字和祝福。</p>

  <div class="stage-wrap">
    <div id="stage"></div>
    <div id="hint">点下面的口味开始叠</div>
  </div>
  <p id="count" aria-live="polite">已选 0 / 4</p>

  <div id="grid"></div>

  <div class="row">
    <button id="undo">撤销一球</button>
    <button id="clear">清空</button>
    <button id="rand">随机叠</button>
  </div>
  <div class="row"><button id="make" class="primary">做好啦，取个名字</button></div>

  <div id="result" hidden>
    <p id="rname"></p>
    <p id="rbless"></p>
  </div>
  <div class="row"><button id="save">保存成图片</button></div>
  <p id="msg" aria-live="polite"></p>
  <p id="err" style="font-size:12px;color:#c0392b;word-break:break-all;"></p>
  <p style="font-size:11px;color:var(--muted);text-align:center;">v2</p>
</main>

<script>
var F=[
{n:"草莓酸奶",kw:"草莓",c:"#f4a7bb",l:"#fbd0dc",d:"#e07f9d",t:"swirl",k:"#d9547a"},
{n:"覆盆子",kw:"覆盆子",c:"#d83a60",l:"#ee6f8c",d:"#a8203f",t:"none",k:null},
{n:"曲奇巧克力",kw:"曲奇",c:"#d2ad84",l:"#e8cfae",d:"#a87f56",t:"chips",k:"#5a3a22"},
{n:"柠檬",kw:"柠檬",c:"#f7dc70",l:"#fcee9f",d:"#e3b93e",t:"none",k:null},
{n:"薄荷巧克力",kw:"薄荷",c:"#9be0bc",l:"#c9f2dc",d:"#62b98d",t:"chips",k:"#4b3324"},
{n:"焦糖奶油",kw:"焦糖",c:"#e8d0b0",l:"#f6e6cf",d:"#c9a073",t:"swirl",k:"#b9834a"},
{n:"草莓果粒",kw:"莓果",c:"#f8b6b6",l:"#fcd8d8",d:"#ea8c8c",t:"dots",k:"#e0443f"},
{n:"粉白双拼",kw:"粉雾",c:"#f9dde6",l:"#fff2f6",d:"#efb2c6",t:"swirl",k:"#f08fb0"},
{n:"浆果漩涡",kw:"浆果",c:"#fbf0d6",l:"#fffaf0",d:"#e6d3a6",t:"swirl",k:"#a02a3d"},
{n:"巧克力莓",kw:"巧莓",c:"#d98aa0",l:"#ecb0c0",d:"#a8586f",t:"chips",k:"#3a2a2a"},
{n:"核桃莓果",kw:"核桃",c:"#fbf0d6",l:"#fffaf0",d:"#e6d3a6",t:"dots",k:"#b32a47"},
{n:"葡萄",kw:"葡萄",c:"#b99bd8",l:"#d9c6ee",d:"#8f6fb8",t:"none",k:null}
];
var SUFFIX=["云朵塔","悄悄话","小奇迹","晚安曲","糖果梦","星星信","午后诗","软软的梦","小确幸","日记本"];
var BLESS=[
"愿你今天被好运轻轻接住。",
"新的一年，慢慢来，也会很甜。",
"所有等你的好事，都在路上。",
"愿你的烦恼，融化得比冰淇淋还快。",
"今天的你，值得一整支甜。",
"平安喜乐，万事软软糯糯。",
"愿你被温柔对待，也温柔地爱自己。",
"新的一年，少一点焦虑，多一点好胃口。",
"祝你有新的景气，新的未来。",
"愿你想要的，都慢慢靠近。",
"别着急，甜的东西都值得等。",
"愿你每个小愿望，都有回音。",
"今晚好梦，明天有光。",
"圣诞快乐，今天也要开心一点。"
];
var CH=[[-30,-6,20],[-6,-30,-30],[22,-16,60],[30,0,-10],[-14,6,40],[8,-4,10],[-36,-22,70],[34,-26,-40]];
var DT=[[-28,-8],[0,-26],[26,-8],[-10,8],[18,10],[-36,6],[8,-6],[36,-18]];
var sel=[], made=null;

function defsOne(f,i,p){
  var s='';
  s+='<radialGradient id="'+p+i+'d" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="'+f.l+'"/><stop offset=".5" stop-color="'+f.c+'"/><stop offset="1" stop-color="'+f.d+'"/></radialGradient>';
    s+='<linearGradient id="'+p+i+'f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+f.c+'"/><stop offset="1" stop-color="'+f.d+'"/></linearGradient>';
  return s;
}
function defs(p){
  var s='';
  F.forEach(function(f,i){ s+=defsOne(f,i,p); });
  return s;
}
function inner(f,i,p){
  var s='<ellipse cx="2" cy="18" rx="54" ry="14" fill="#3a2020" opacity=".10"/>';
  for(var a=0;a<20;a++){
    var t=a/20*Math.PI*2, rr=9+((a*7)%4);
    s+='<circle cx="'+(Math.cos(t)*47).toFixed(1)+'" cy="'+(Math.sin(t)*11+12).toFixed(1)+'" r="'+rr+'" fill="url(#'+p+i+'f)"/>';
  }
  s+='<path d="M-52 8 C-58 -26 -32 -52 0 -52 C32 -52 58 -26 52 8 C30 20 -30 20 -52 8 Z" fill="url(#'+p+i+'d)"/>';
  s+='<g fill="none" stroke-linecap="round" stroke-width="2.2">'+
     '<g stroke="'+f.d+'" opacity=".30"><path d="M-38 -8 Q-20 -22 -4 -14"/><path d="M6 -26 Q22 -34 38 -18"/><path d="M-30 6 Q-10 -4 10 4"/><path d="M14 -4 Q30 -10 42 2"/><path d="M-24 -34 Q-12 -42 2 -38"/></g>'+
     '<g stroke="'+f.l+'" opacity=".55"><path d="M-36 -10 Q-18 -24 -2 -16"/><path d="M8 -28 Q24 -36 40 -20"/><path d="M-28 4 Q-8 -6 12 2"/></g></g>';
  if(f.t==="chips"){
    CH.forEach(function(c){
      s+='<g transform="translate('+c[0]+' '+c[1]+') rotate('+c[2]+')"><polygon points="-5,-3 4,-4 6,3 -3,5" fill="'+f.k+'"/><polygon points="-5,-3 4,-4 3,-2 -4,-1" fill="#fff" opacity=".22"/></g>';
    });
  } else if(f.t==="swirl"){
    s+='<path d="M-42 -2 C-22 -26 -2 8 20 -12 S44 -8 48 -2" fill="none" stroke="'+f.k+'" stroke-width="7" stroke-linecap="round" opacity=".72"/>';
    s+='<path d="M-30 10 C-12 -6 6 14 26 2" fill="none" stroke="'+f.k+'" stroke-width="4" stroke-linecap="round" opacity=".55"/>';
  } else if(f.t==="dots"){
    DT.forEach(function(d,j){
      var r=3.2+(j%3)*0.8;
      s+='<circle cx="'+d[0]+'" cy="'+d[1]+'" r="'+r+'" fill="'+f.k+'"/><circle cx="'+(d[0]-1)+'" cy="'+(d[1]-1.2)+'" r="'+(r*0.35)+'" fill="#fff" opacity=".55"/>';
    });
  }
  s+='<ellipse cx="-18" cy="-30" rx="18" ry="8" fill="#fff" opacity=".32" transform="rotate(-18 -18 -30)"/>';
  return s;
}
function wrapText(t,n){
  if(t.length<=n) return [t];
  var cut=t.indexOf("，");
  if(cut>0 && cut<n+2) return [t.slice(0,cut+1), t.slice(cut+1)];
  return [t.slice(0,n), t.slice(n)];
}
function scene(p,withText){
  var H=withText?470:370;
  var s='<defs>'+defs(p)+
    '<radialGradient id="'+p+'bg" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#fffdfb"/><stop offset="1" stop-color="#f6f0eb"/></radialGradient>'+
    '<linearGradient id="'+p+'cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a560"/><stop offset=".5" stop-color="#f0cb92"/><stop offset="1" stop-color="#cf9a55"/></linearGradient>'+
    '<clipPath id="'+p+'cc"><polygon points="106,246 194,246 150,360"/></clipPath></defs>';
  s+='<rect width="300" height="'+H+'" fill="url(#'+p+'bg)"/>';
  s+='<polygon points="106,246 194,246 150,360" fill="url(#'+p+'cone)"/>';
  s+='<g clip-path="url(#'+p+'cc)" stroke="#a9763a" stroke-width="1.6" opacity=".55">';
  for(var k=-6;k<10;k++){
    s+='<line x1="'+(92+k*14)+'" y1="240" x2="'+(92+k*14+80)+'" y2="372"/>';
    s+='<line x1="'+(208-k*14)+'" y1="240" x2="'+(208-k*14-80)+'" y2="372"/>';
  }
  s+='</g>';
  sel.forEach(function(i,idx){
    s+='<g transform="translate(150,'+(226-idx*46)+')">'+inner(F[i],i,p)+'</g>';
  });
  if(withText && made){
    s+='<text x="150" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#3d2b31" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif">'+made.name+'</text>';
    wrapText(made.bless,16).forEach(function(line,i){
      s+='<text x="150" y="'+(434+i*20)+'" text-anchor="middle" font-size="13" fill="#8c7077" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif">'+line+'</text>';
    });
  }
  return {markup:s,h:H};
}
function hash(m){
  var h=0; sel.forEach(function(i,pos){ h+=(i+1)*(pos+3)*m; });
  return h+sel.length*m;
}
function make(){
  if(!sel.length) return null;
  var a=F[sel[0]].kw, b=F[sel[sel.length-1]].kw;
  var pre=(sel.length>1 && a!==b)? a+b : a;
  return {name:pre+SUFFIX[hash(7)%SUFFIX.length], bless:BLESS[hash(13)%BLESS.length]};
}
function render(){
  document.getElementById('stage').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 370" role="img" aria-label="蛋筒冰淇淋预览">'+scene('s',false).markup+'</svg>';
  document.getElementById('hint').style.display=sel.length?'none':'block';
  document.getElementById('count').textContent='已选 '+sel.length+' / 4'+
    (sel.length?'：'+sel.map(function(i){return F[i].n;}).join(' + '):'');
  var r=document.getElementById('result');
  if(made){
    r.hidden=false;
    document.getElementById('rname').textContent=made.name;
    document.getElementById('rbless').textContent=made.bless;
  } else { r.hidden=true; }
}
function changed(){ made=null; document.getElementById('msg').textContent=''; render(); }

var grid=document.getElementById('grid'), msg=document.getElementById('msg');
F.forEach(function(f,i){
  var b=document.createElement('button');
  b.className='flavor';
  b.innerHTML='<svg viewBox="-66 -56 132 112" width="48" height="41" aria-hidden="true"><defs>'+defsOne(f,i,'w')+'</defs>'+inner(f,i,'w')+'</svg><span>'+f.n+'</span>';
  b.onclick=function(){
    if(sel.length>=4){ msg.textContent='最多四球，先撤销一个吧'; return; }
    sel.push(i); changed();
  };
  grid.appendChild(b);
});
document.getElementById('undo').onclick=function(){ sel.pop(); changed(); };
document.getElementById('clear').onclick=function(){ sel=[]; changed(); };
document.getElementById('rand').onclick=function(){
  sel=[];
  while(sel.length<4){ var r=Math.floor(Math.random()*F.length); if(sel.indexOf(r)<0) sel.push(r); }
  changed();
};
document.getElementById('make').onclick=function(){
  if(!sel.length){ msg.textContent='先叠一球，再取名字'; return; }
  made=make(); msg.textContent=''; render();
};
document.getElementById('save').onclick=function(){
  if(!sel.length){ msg.textContent='先叠一球，再保存'; return; }
  var sc=scene('x',true), W=900, Hh=Math.round(900*sc.h/300);
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 '+sc.h+'" width="'+W+'" height="'+Hh+'">'+sc.markup+'</svg>';
  var url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas'); c.width=W; c.height=Hh;
    c.getContext('2d').drawImage(img,0,0,W,Hh);
    URL.revokeObjectURL(url);
    c.toBlob(function(blob){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='ice-cream.png';
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent='已保存成图片';
    },'image/png');
  };
  img.onerror=function(){ msg.textContent='保存失败，可以直接截图'; };
  img.src=url;
};
try{ render(); }catch(e){ document.getElementById('err').textContent='出错了：'+e.message; }
</script>
</body>
</html>
