<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰淇淋叠叠乐</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#fff7fa; --card:#ffffff; --ink:#4a2f3b; --muted:#9a6f80;
    --line:#f0cfdb; --accent:#e8789c; --accent-ink:#ffffff; --chip:#fdeaf0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#241820; --card:#2f2029; --ink:#fbe9f0; --muted:#c79bb0;
      --line:#4d3341; --accent:#ee86a8; --accent-ink:#2a1119; --chip:#3b2732;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    line-height:1.5;
  }
  main{max-width:440px; margin:0 auto; padding:16px 14px 28px;}
  h1{font-size:22px; margin:4px 0 2px; font-weight:700; letter-spacing:.02em;}
  .sub{margin:0 0 12px; font-size:14px; color:var(--muted);}
  .stage-wrap{position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line);}
  #stage{display:block; width:100%; height:auto;}
  #hint{
    position:absolute; left:0; right:0; top:42%; text-align:center;
    font-size:15px; color:#9a6a7c; pointer-events:none;
  }
  #count{margin:10px 0 8px; font-size:14px; color:var(--muted); text-align:center; min-height:22px;}
  #grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  button{
    font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:12px; cursor:pointer;
    touch-action:manipulation;
  }
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
  button:active{transform:scale(.97);}
  .flavor{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 6px; font-size:12px;}
  .row{display:flex; gap:8px; margin-top:12px;}
  .row button{flex:1; height:44px; font-size:14px;}
  .primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  #msg{margin:8px 0 0; font-size:13px; color:var(--muted); text-align:center; min-height:20px;}
  @media (prefers-reduced-motion: reduce){button:active{transform:none;}}
</style>
</head>
<body>
<main>
  <h1>冰淇淋叠叠乐</h1>
  <p class="sub">点下面的口味，最多叠四球。</p>

  <div class="stage-wrap">
    <svg id="stage" viewBox="0 0 300 370" role="img" aria-label="蛋筒冰淇淋预览"></svg>
    <div id="hint">点下面的口味开始叠</div>
  </div>
  <p id="count" aria-live="polite">已选 0 / 4</p>

  <div id="grid"></div>

  <div class="row">
    <button id="undo">撤销一球</button>
    <button id="clear">清空</button>
    <button id="rand">随机叠</button>
  </div>
  <div class="row">
    <button id="save" class="primary">保存成图片</button>
  </div>
  <p id="msg" aria-live="polite"></p>
</main>

<script>
var F=[
{n:"草莓酸奶",c:"#f2a6b8",r:"#e98fa6",k:"#d9547a"},
{n:"覆盆子",c:"#d6335a",r:"#bf2549",k:null},
{n:"曲奇巧克力",c:"#d9b48a",r:"#bf9568",k:"#6b4423"},
{n:"柠檬",c:"#f6d86a",r:"#efc84a",k:null},
{n:"薄荷巧克力",c:"#9fe3c0",r:"#86d3aa",k:"#4a3322"},
{n:"焦糖奶油",c:"#e7cfb2",r:"#cfae86",k:"#b98a57"},
{n:"草莓果粒",c:"#f7b3b3",r:"#f29a9a",k:"#e0443f"},
{n:"粉白双拼",c:"#f9d9e3",r:"#f4b6cb",k:"#f08fb0"},
{n:"浆果漩涡",c:"#fbf0d6",r:"#ecdcb4",k:"#a02a3d"},
{n:"巧克力莓",c:"#d98ba0",r:"#8a5a4a",k:"#3a2a2a"},
{n:"核桃莓果",c:"#fbf0d6",r:"#ecdcb4",k:"#b32a47"},
{n:"葡萄",c:"#b89ad6",r:"#a183c4",k:null}
];
var DOTS=[[-28,-8,5,4],[0,-24,4,3],[26,-6,5,4],[-10,12,4,3],[18,16,5,4],[-34,14,3,3],[6,2,4,3]];
var sel=[];

function inner(f){
  var s='';
  for(var a=0;a<14;a++){
    var t=a/14*Math.PI*2;
    s+='<circle cx="'+(Math.cos(t)*50).toFixed(1)+'" cy="'+(Math.sin(t)*40+8).toFixed(1)+'" r="13" fill="'+f.r+'"/>';
  }
  s+='<ellipse cx="0" cy="0" rx="54" ry="44" fill="'+f.c+'"/>';
  s+='<ellipse cx="-16" cy="-18" rx="20" ry="9" fill="#fff" opacity=".28"/>';
  if(f.k){
    DOTS.forEach(function(p){
      s+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="'+p[2]+'" ry="'+p[3]+'" fill="'+f.k+'"/>';
    });
  }
  return s;
}
function star(x,y,sz){
  var pts=[];
  for(var i=0;i<10;i++){
    var r=i%2?sz*0.45:sz, a=-Math.PI/2+i*Math.PI/5;
    pts.push((x+Math.cos(a)*r).toFixed(1)+','+(y+Math.sin(a)*r).toFixed(1));
  }
  return '<polygon points="'+pts.join(' ')+'" fill="#fff3c4" stroke="#bfe3f5" stroke-width="3" stroke-linejoin="round"/>';
}
function sceneMarkup(){
  var s='<rect x="0" y="0" width="300" height="370" fill="#fde4ec"/>';
  for(var y=0;y<370;y+=40){ s+='<rect x="0" y="'+y+'" width="300" height="20" fill="#fff" opacity=".35"/>'; }
  s+='<circle cx="60" cy="330" r="46" fill="#bfe3e0" opacity=".55"/>';
  s+=star(40,50,22)+star(262,70,18)+star(34,250,16)+star(266,260,20);
  s+='<clipPath id="cc"><polygon points="105,245 195,245 150,356"/></clipPath>';
  s+='<polygon points="105,245 195,245 150,356" fill="#eec48a"/>';
  s+='<g clip-path="url(#cc)" stroke="#c99458" stroke-width="2" opacity=".8">';
  for(var k=-6;k<10;k++){
    s+='<line x1="'+(95+k*14)+'" y1="240" x2="'+(95+k*14+80)+'" y2="370"/>';
    s+='<line x1="'+(205-k*14)+'" y1="240" x2="'+(205-k*14-80)+'" y2="370"/>';
  }
  s+='</g>';
  sel.forEach(function(i,idx){
    s+='<g transform="translate(150,'+(222-idx*50)+')">'+inner(F[i])+'</g>';
  });
  return s;
}
function render(){
  document.getElementById('stage').innerHTML=sceneMarkup();
  document.getElementById('hint').style.display=sel.length?'none':'block';
  document.getElementById('count').textContent='已选 '+sel.length+' / 4'+
    (sel.length?'：'+sel.map(function(i){return F[i].n;}).join(' + '):'');
}

var grid=document.getElementById('grid'), msg=document.getElementById('msg');
F.forEach(function(f,i){
  var b=document.createElement('button');
  b.className='flavor';
  b.innerHTML='<svg viewBox="-64 -54 128 108" width="48" height="41" aria-hidden="true">'+inner(f)+'</svg><span>'+f.n+'</span>';
  b.onclick=function(){
    if(sel.length>=4){ msg.textContent='最多四球，先撤销一个吧'; return; }
    msg.textContent=''; sel.push(i); render();
  };
  grid.appendChild(b);
});
document.getElementById('undo').onclick=function(){ sel.pop(); msg.textContent=''; render(); };
document.getElementById('clear').onclick=function(){ sel=[]; msg.textContent=''; render(); };
document.getElementById('rand').onclick=function(){
  sel=[]; msg.textContent='';
  while(sel.length<4){
    var r=Math.floor(Math.random()*F.length);
    if(sel.indexOf(r)<0) sel.push(r);
  }
  render();
};
document.getElementById('save').onclick=function(){
  if(!sel.length){ msg.textContent='先叠一球，再保存'; return; }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 370" width="900" height="1110">'+sceneMarkup()+'</svg>';
  var url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas'); c.width=900; c.height=1110;
    c.getContext('2d').drawImage(img,0,0,900,1110);
    URL.revokeObjectURL(url);
    c.toBlob(function(blob){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='ice-cream.png';
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent='已保存成图片，可以放进 Notion 或相册';
    },'image/png');
  };
  img.onerror=function(){ msg.textContent='保存失败，可以直接截图'; };
  img.src=url;
};
render();
</script>
</body>
</html>
